name: SMBMountManager
options:
  bundleIdPrefix: org.imstevelin
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

packages: {}

targets:
  SMBMountManager:
    type: application
    platform: macOS
    sources:
      - path: SMBMountManager
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.imstevelin.SMBMountClientV3
        PRODUCT_NAME: SMB掛載客戶端
        PRODUCT_MODULE_NAME: SMBMountManager
        MARKETING_VERSION: "1.7.2"
        CURRENT_PROJECT_VERSION: "11"
        INFOPLIST_FILE: SMBMountManager/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SMBMountManager/Resources/SMBMountManager.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X9X6NCYV6F
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: false
        SWIFT_EMIT_LOC_STRINGS: true

  SMBMountManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SMBMountManagerTests
    dependencies:
      - target: SMBMountManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.imstevelin.SMBMountClientV3Tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SMB掛載客戶端.app/Contents/MacOS/SMB掛載客戶端"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SMBMountManager:
    build:
      targets:
        SMBMountManager: all
        SMBMountManagerTests: [test]
    test:
      targets:
        - SMBMountManagerTests
